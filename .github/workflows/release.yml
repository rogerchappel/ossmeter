name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run release:check
      - run: npm pack
      - name: Publish package to npm
        run: |
          PACKAGE_SPEC="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$PACKAGE_SPEC" version --json >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published; skipping npm publish."
          else
            npm publish --access public --provenance
          fi
      - name: Generate release notes
        run: |
          if ! npm run release:notes --if-present -- . > RELEASE_NOTES.md || [ ! -s RELEASE_NOTES.md ]; then
            echo "## Changes" > RELEASE_NOTES.md
            git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)..HEAD >> RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
